name: Enviar mensajes programados
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: mensajes-programados
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Procesar mensajes vencidos
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 10 --max-time 45 \
            'https://puerta-a-las-misiones.isaac-almendarez96.chatgpt.site/api/messages/dispatch'
